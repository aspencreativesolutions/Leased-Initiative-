<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Security Dashboard</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4ff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
    }

    .scene {
      position: relative;
      width: 580px;
      height: 580px;
    }

    /* orbit */
    .orbit-svg {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* tiles */
    .tile {
      position: absolute;
      cursor: pointer;
      border-radius: 24px;
      background: #ffffff;
      border: 1px solid rgba(200, 210, 240, 0.7);
      box-shadow:
        0 1px 2px rgba(80,100,160,0.04),
        0 4px 12px rgba(80,100,160,0.08),
        0 16px 40px rgba(80,100,160,0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.25s cubic-bezier(.34,1.56,.64,1),
                  box-shadow 0.25s ease;
      user-select: none;
    }

    .tile:hover {
      transform: translateY(-10px) scale(1.05);
      box-shadow:
        0 2px 4px rgba(80,100,160,0.06),
        0 12px 28px rgba(80,100,160,0.14),
        0 32px 56px rgba(80,100,160,0.14);
      z-index: 10;
    }

    .tile:active { transform: translateY(-4px) scale(1.02); }

    .icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #5a6480;
    }

    /* phone tile */
    .tile.phone {
      width: 110px;
      height: 200px;
      border-radius: 32px;
      gap: 12px;
    }
    .tile.phone .icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: 16px;
    }

    /* standard tile */
    .tile.sm {
      width: 110px;
      height: 110px;
    }

    svg { display: block; }
  </style>
</head>
<body>
<div class="scene">

  <!-- orbit + decoration -->
  <svg class="orbit-svg" viewBox="0 0 580 580">
    <circle cx="290" cy="294" r="210"
            fill="none"
            stroke="rgba(150,170,220,0.35)"
            stroke-width="1.5"
            stroke-dasharray="5 10"/>
    <!-- diamond accent -->
    <polygon points="76,288 88,300 76,312 64,300"
             fill="none" stroke="rgba(100,140,210,0.5)" stroke-width="1.8"/>
    <!-- dots -->
    <circle cx="200" cy="188" r="4.5" fill="rgba(100,140,210,0.4)"/>
    <circle cx="182" cy="210" r="2.5" fill="rgba(150,180,225,0.4)"/>
    <circle cx="400" cy="186" r="2.5" fill="rgba(150,180,225,0.4)"/>
    <circle cx="414" cy="336" r="4.5" fill="rgba(100,140,210,0.4)"/>
    <circle cx="428" cy="358" r="2.5" fill="rgba(150,180,225,0.4)"/>
    <circle cx="196" cy="434" r="3.5" fill="rgba(100,140,210,0.4)"/>
  </svg>

  <!-- ── PHONE ── -->
  <div class="tile phone" id="phone" style="left:235px; top:120px;">
    <div class="icon-wrap" style="background:linear-gradient(135deg,#1a1a2e,#16213e);">
      <svg width="28" height="48" viewBox="0 0 28 48" fill="none"
           stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="24" height="44" rx="6" stroke-width="2"/>
        <rect x="9" y="3.5" width="10" height="4" rx="2" fill="#fff" stroke="none"/>
        <!-- fingerprint -->
        <g transform="translate(14,26)" stroke="#fff">
          <path d="M0,-9 C4,-9 8,-5 8,0 C8,6 4,10 0,11" stroke-width="1.6"/>
          <path d="M0,-9 C-4,-9 -8,-5 -8,0 C-8,6 -4,10 0,11" stroke-width="1.6"/>
          <path d="M0,-4 C2,-4 4,-2 4,0 C4,3 2,5 0,6" stroke-width="1.6"/>
          <path d="M0,-4 C-2,-4 -4,-2 -4,0 C-4,3 -2,5 0,6" stroke-width="1.6"/>
          <line x1="0" y1="-9" x2="0" y2="-4" stroke-width="1.6"/>
        </g>
        <line x1="10" y1="43" x2="18" y2="43" stroke-width="2" stroke="rgba(255,255,255,0.4)"/>
      </svg>
    </div>
    <span class="label">Biometrics</span>
  </div>

  <!-- ── SHIELD ── -->
  <div class="tile sm" id="shield" style="left:40px; top:68px;">
    <div class="icon-wrap" style="background:linear-gradient(135deg,#3b82f6,#2563eb);">
      <svg width="28" height="30" viewBox="0 0 28 30" fill="none"
           stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14,2 L26,6.5 L26,16 C26,23 14,28 14,28 C14,28 2,23 2,16 L2,6.5 Z" stroke-width="2.2"/>
        <polyline points="8,15 12,19 20,11" stroke-width="2.4" stroke="#fff"/>
      </svg>
    </div>
    <span class="label">Protection</span>
  </div>

  <!-- ── CARD ── -->
  <div class="tile sm" id="card" style="left:430px; top:66px;">
    <div class="icon-wrap" style="background:linear-gradient(135deg,#8b5cf6,#6d28d9);">
      <svg width="34" height="26" viewBox="0 0 34 26" fill="none"
           stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="30" height="22" rx="4" stroke-width="2.2"/>
        <line x1="2" y1="9" x2="32" y2="9" stroke-width="5" stroke="rgba(255,255,255,0.25)"/>
        <rect x="6" y="14" width="8" height="6" rx="2" stroke-width="1.8"/>
        <circle cx="24" cy="17" r="3.5" stroke-width="1.8"/>
        <circle cx="28" cy="17" r="3.5" stroke-width="1.8"/>
      </svg>
    </div>
    <span class="label">Payments</span>
  </div>

  <!-- ── PADLOCK ── -->
  <div class="tile sm" id="padlock" style="left:28px; top:300px;">
    <div class="icon-wrap" style="background:linear-gradient(135deg,#f59e0b,#d97706);">
      <svg width="28" height="34" viewBox="0 0 28 34" fill="none"
           stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7,14 L7,9 C7,4 21,4 21,9 L21,14" stroke-width="2.2"/>
        <rect x="2" y="14" width="24" height="18" rx="5" stroke-width="2.2"/>
        <circle cx="14" cy="21" r="3" stroke-width="2"/>
        <line x1="14" y1="24" x2="14" y2="29" stroke-width="2.2"/>
      </svg>
    </div>
    <span class="label">Encryption</span>
  </div>

  <!-- ── WIFI ── -->
  <div class="tile sm" id="wifi" style="left:442px; top:316px;">
    <div class="icon-wrap" style="background:linear-gradient(135deg,#10b981,#059669);">
      <svg width="34" height="28" viewBox="0 0 34 28" fill="none"
           stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2,9 C8,2 26,2 32,9" stroke-width="2.4"/>
        <path d="M6,15 C10,10 24,10 28,15" stroke-width="2.4"/>
        <path d="M11,20 C13,17 21,17 23,20" stroke-width="2.4"/>
        <circle cx="17" cy="26" r="2.5" fill="#fff" stroke="none"/>
      </svg>
    </div>
    <span class="label">Network</span>
  </div>

  <!-- ── KEY ── -->
  <div class="tile sm" id="key" style="left:235px; top:470px;">
    <div class="icon-wrap" style="background:linear-gradient(135deg,#ef4444,#dc2626);">
      <svg width="36" height="22" viewBox="0 0 36 22" fill="none"
           stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="9" r="7" stroke-width="2.2"/>
        <circle cx="9" cy="9" r="3" stroke-width="2"/>
        <line x1="16" y1="9" x2="34" y2="9" stroke-width="2.2"/>
        <line x1="26" y1="9" x2="26" y2="14" stroke-width="2.2"/>
        <line x1="31" y1="9" x2="31" y2="13" stroke-width="2.2"/>
      </svg>
    </div>
    <span class="label">Access Keys</span>
  </div>

</div>

<script>
  ['phone','shield','card','padlock','wifi','key'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      // placeholder — wire up later
    });
  });
</script>
</body>
</html>
