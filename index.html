<!doctype html>
<html lang="en" data-theme="ocean">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Client Craft" />
    <title>Client Craft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Bitter:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;0,9..40,600;0,9..40,700&family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Karla:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&family=Lora:wght@500;600;700&family=Mulish:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Orbitron:wght@500;600;700&family=Outfit:wght@500;600;700&family=Playfair+Display:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var path = window.location.pathname;
        if (path === '/studio/login' || path === '/studio/register') {
          document.documentElement.setAttribute('data-theme', 'ocean');
          return;
        }
        var k = 'client-craft-theme';
        var t = localStorage.getItem(k);
        var valid = [
          'editorial','soft','mono','golden','ocean',
          'rose','forest','midnight','citrus','vintage','neon','slate','terracotta'
        ];
        if (t && valid.indexOf(t) !== -1) {
          document.documentElement.setAttribute('data-theme', t);
        } else {
          document.documentElement.setAttribute('data-theme', 'ocean');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
