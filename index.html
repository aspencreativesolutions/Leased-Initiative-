<!doctype html>
<html lang="en" data-theme="slate" data-appearance="light" data-caps-labels="1" data-caps-buttons="1">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Leased Initiative" />
    <title>Leased Initiative — Landlord &amp; Tenant Management</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var defaultTheme = 'slate';
        var defaultAppearance = 'light';
        var valid = ['graphite', 'ink', 'ocean', 'slate'];
        var appearanceKey = 'leased-theme-appearance';
        var appearance = localStorage.getItem(appearanceKey);
        if (appearance !== 'light' && appearance !== 'dark') appearance = defaultAppearance;
        document.documentElement.setAttribute('data-appearance', appearance);

        // Introduction page + studio auth always paint as Slate Bureau
        if (
          path === '/' ||
          path === '' ||
          path === '/studio/login' ||
          path === '/studio/register'
        ) {
          document.documentElement.setAttribute('data-theme', defaultTheme);
          document.documentElement.setAttribute('data-appearance', defaultAppearance);
          return;
        }
        var isPortal =
          path.indexOf('/portal') === 0 || path === '/login' || path === '/register';
        if (path.indexOf('/studio') === 0) isPortal = false;
        var k = isPortal ? 'leased-portal-theme-v5' : 'leased-app-theme-v5';
        var t = localStorage.getItem(k);
        if (t && valid.indexOf(t) !== -1) {
          document.documentElement.setAttribute('data-theme', t);
        } else {
          document.documentElement.setAttribute('data-theme', defaultTheme);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
